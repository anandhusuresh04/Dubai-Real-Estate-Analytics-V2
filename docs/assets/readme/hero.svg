      <stop offset="1" stop-color="#84e3cd"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#79dccc" stop-opacity="0"/>
      <stop offset="1" stop-color="#79dccc" stop-opacity="0.45"/>
    </linearGradient>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#91c6cc" opacity="0.16"/>
    </pattern>
    <clipPath id="frame"><rect x="0" y="0" width="1400" height="392" rx="18"/></clipPath>
  </defs>
