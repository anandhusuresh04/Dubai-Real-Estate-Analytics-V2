    <text x="65" y="340" fill="#80b7c1" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="2.0">FROZEN HISTORICAL RESEARCH   /   2010—2025   /   NOMINAL AED</text>
