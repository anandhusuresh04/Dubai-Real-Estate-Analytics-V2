<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="392" viewBox="0 0 1400 392" role="img" aria-labelledby="title desc">
  <title id="title">Dubai Real Estate Analytics V2 — Research Intelligence</title>
  <desc id="desc">A midnight-blue title banner with restrained teal data-line motifs, architectural forms, and the historical scope 2010–2025.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#091b2d"/>
      <stop offset="0.58" stop-color="#0e2840"/>
      <stop offset="1" stop-color="#14364a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
